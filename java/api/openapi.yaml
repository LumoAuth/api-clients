    get:
      description: "Test endpoint that behaves like the MCP server's protected endpoint:\
        \ validates the presented Bearer / DPoP access token (audience, scopes, DPoP\
        \ binding) or answers the MCP-spec 401 challenge pointing at the protected\
        \ resource metadata."
      operationId: getServerChallenge
      parameters:
      - explode: false
        in: path
