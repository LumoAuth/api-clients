    post:
      description: |-
        POST /api/v1/authz/zanzibar/expand
        Body: {
          "object": "document:123",
          "relation": "viewer"
        }
        Response: {
          "tree": {
            "type": "union" | "intersection" | "leaf",
            "object": "document:123",
            "relation": "viewer",
            "children": [ ...nested nodes... ],
            "subjects": [ "user:1", "group:2#member" ]
          }
        }

        Expansion always reveals other subjects, so it requires the oracle
        privilege (`authz.check` permission or `authz:check` scope) — there is
        no "self" variant.
      operationId: expandRelation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpandRelationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandRelationResponse"
          description: The userset tree for object#relation.
        "400":
          description: Missing object/relation or malformed object identifier.
        "403":
          description: insufficient_permissions — expand requires the authz.check
            permission or the authz:check scope.
      summary: |-
        Zanzibar-style userset expansion: every subject that satisfies
        `object#relation`, as a tree that mirrors the namespace rewrites.
      tags:
      - Authorization
      x-symfony-route: api_authz_zanzibar_expand
      x-content-type: application/json
      x-accepts:
