        name: serverId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServerChallengeResponse"
          description: The access token is valid for this MCP server.
        "401":
          description: "unauthorized / invalid_token with the MCP WWW-Authenticate\
            \ challenge (resource_metadata, and scope when the server includes it)."
          headers:
            WWW-Authenticate:
              explode: false
              schema:
                type: string
              style: simple
        "403":
          description: insufficient_scope — the token lacks required scopes (listed
            in scope and in WWW-Authenticate).
          headers:
            WWW-Authenticate:
              explode: false
              schema:
                type: string
              style: simple
        "404":
          description: "not_found — unknown organization, or unknown / inactive MCP\
            \ server."
