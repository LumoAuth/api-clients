          description: Invalid or missing agent token.
        "403":
          description: Task belongs to a different agent.
        "404":
          description: Tenant or task not found.
        "429":
          description: Rate limit exceeded.
      security:
      - BearerAuth: []
      summary: Request a JIT permission using RFC 9396 authorization_details.
      tags:
