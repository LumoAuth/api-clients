  /orgs/{orgId}/api/v1/agents/{agentId}/attest:
    post:
      description: "Public (the attestation token is the credential). The agent runtime\
        \ presents a cloud-issued OIDC token (GitHub Actions, GCP, AWS IRSA, Kubernetes,\
        \ Azure, SPIFFE, …); its signature is verified against the issuer JWKS and\
        \ its subject against the agent's registered workload identity binding. Rate\
        \ limited per IP and per agent; every rejection is the same generic 401."
      operationId: attest
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          type: string
        style: simple
