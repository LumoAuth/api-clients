        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestResponse"
          description: "Attestation accepted: a short-lived (15 minute) LumoAuth access\
            \ token scoped to the agent's capabilities."
        "400":
          description: invalid_json or missing_attestation_token.
        "401":
          description: "attestation_rejected — generic for unknown agent, inactive\
            \ agent / organization, or a token that failed verification."
