  /orgs/{orgId}/api/v1/admin/identities/legacy-saml:
    get:
      description: "Users still bound by a bare NameID (from before SAML links were\
        \ scoped to their IdP). While the organization has more than one SAML IdP\
        \ (`ambiguous: true`) these users are refused at SAML sign-in until relinked.\
        \ Each user lists the IdPs whose allowed email domains claim their address;\
        \ `suggested_idp_id` is set when exactly one does. Filter with `idp_id`."
      operationId: adminIdentitiesLegacySamlReport
      parameters:
      - explode: true
        in: query
        name: idp_id
        required: false
        schema:
          type: integer
        style: form
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentitiesLegacySamlReportResponse"
          description: Report
        "404":
          description: IdP not found
      summary: Legacy SAML bindings report
      tags:
      - "Admin: Users"
      x-symfony-route: api_admin_identities_legacy_saml_report
      x-accepts:
      - application/json
    post:
      description: "Rebinds legacy bare-NameID users to `idp_id`, keeping their NameID:\
        \ either `user_ids`, or every legacy user whose email domain the IdP's allowed\
        \ email domains claim (`all_matching_domains: true`). Users the caller does\
        \ not outrank, or whose NameID is already linked at that IdP, are skipped.\
        \ `dry_run` (default true) only reports what would change. A real run revokes\
        \ each relinked user's sessions, notifies them and is audited (identity.link.created\
        \ per user, identity.link.bulk_relinked once); signed-in admins need fresh\
        \ MFA."
      operationId: adminIdentitiesLegacySamlRelink
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIdentitiesLegacySamlRelinkRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentitiesLegacySamlRelinkResponse"
          description: Plan (dry run) or result
        "403":
          description: step_up_required
        "404":
          description: IdP not found
        "422":
          description: "Neither user_ids nor all_matching_domains given, or the IdP\
            \ has no allowed email domains"
      summary: Relink legacy SAML users to an IdP
      tags:
      - "Admin: Users"
      x-symfony-route: api_admin_identities_legacy_saml_relink
      x-content-type: application/json
      x-accepts:
      - application/json
