  /orgs/{orgId}/api/v1/admin/users/{userId}/identities:
    get:
      description: "SAML (IdP + NameID), LDAP (directory + DN), and social / OIDC\
        \ provider links. A SAML link with `legacy: true` stores a bare NameID and\
        \ is refused at sign-in while the organization has more than one SAML IdP."
      operationId: adminIdentitiesList
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentitiesListResponse"
          description: Links
        "404":
          description: User not found
      summary: List a user's federated identity links
      tags:
      - "Admin: Users"
      x-symfony-route: api_admin_identities_list
      x-accepts:
      - application/json
    post:
      description: "Sets (or replaces) the user's SAML binding (`idp_id` + `name_id`)\
        \ or LDAP binding (`ldap_config_id` + `dn`; omit `dn` to look the entry up\
        \ in the directory by the user's email / username). Refused with 409 when\
        \ another user already holds that identity, or when the user is linked to\
        \ a different federated source (unlink it first). Revokes the user's sessions\
        \ and tokens, notifies the user and is audited as identity.link.created. Signed-in\
        \ admins must have passed MFA in the last 10 minutes (send X-MFA-Challenge\
        \ with an approved step-up challenge when calling with a user token)."
      operationId: adminIdentitiesLink
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIdentitiesLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAgentsGetResponse"
          description: Linked
        "403":
          description: "Actor does not outrank the user, or step_up_required"
        "404":
          description: "User, IdP or directory not found"
        "409":
          description: identity_conflict
        "422":
          description: invalid_identity / directory_lookup_failed
      summary: Link a SAML or LDAP identity to a user
      tags:
      - "Admin: Users"
      x-symfony-route: api_admin_identities_link
      x-content-type: application/json
      x-accepts:
      - application/json
