  /orgs/{orgId}/api/v1/zanzibar/check:
    post:
      operationId: checkRelationScoped
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRelationScopedResponse"
          description: Decision
      summary: Zanzibar relationship check
      tags:
      - Authorization
      x-symfony-route: api_zanzibar_check_scoped
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/zanzibar/expand:
    post:
      description: |-
        Body: {"object": "document:123", "relation": "viewer"}
        Response: {"tree": {"type", "object", "relation", "children", "subjects"}}
      operationId: expandRelationScoped
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpandRelationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandRelationResponse"
          description: The userset tree for object#relation.
        "400":
          description: Missing object/relation or malformed object identifier.
        "403":
          description: insufficient_permissions — expand requires the authz.check
            permission or the authz:check scope; or the token is for another organization.
      summary: |-
        Zanzibar Expand: the userset tree of every subject satisfying
        `object#relation`. Always reveals other subjects, so it requires the
        oracle privilege (`authz.check` permission or `authz:check` scope).
      tags:
      - Authorization
      x-symfony-route: api_zanzibar_expand_scoped
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  schemas:
    MfaAuthenticator:
      description: One enrolled authenticator. `id` is a stable reference such as
        `totp:12` or `passkey:7`.
      example:
        metadata:
          key: ""
        tier_label: Strongest
        amr:
        - amr
        - amr
        created_at: 2000-01-23T04:56:07.000+00:00
        type: passkey
        display_name: display_name
        is_default: true
        activated_at: 2000-01-23T04:56:07.000+00:00
        last_used_context:
          geo: geo
          ip: ip
          user_agent: user_agent
        last_used_at: 2000-01-23T04:56:07.000+00:00
        tier: 1
        id: totp:12
        state: pending
      properties:
        id:
          example: totp:12
          type: string
        type:
          enum:
          - passkey
          - push
          - totp
          - sms_otp
          - voice_otp
          - email_otp
          - recovery_code
          type: string
        display_name:
          maxLength: 64
          type: string
        state:
          enum:
          - pending
          - active
          - suspended
          - revoked
          type: string
        is_default:
          type: boolean
        tier:
          description: 1 strongest (passkey) … 4 basic (SMS/email); 5 = recovery only
          maximum: 5
          minimum: 1
          type: integer
        tier_label:
          enum:
          - Strongest
          - Strong
          - Standard
          - Basic
          - Recovery
          type: string
        amr:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        activated_at:
          format: date-time
          nullable: true
          type: string
        last_used_at:
          format: date-time
          nullable: true
          type: string
        last_used_context:
          $ref: "#/components/schemas/MfaAuthenticator_last_used_context"
        metadata:
          additionalProperties: true
          type: object
      type: object
    MfaChallenge:
      example:
        public_key: "{}"
        delivery: push_sent
        attempts_remaining: 6
        expires_at: 2000-01-23T04:56:07.000+00:00
        purpose: login
        number_match: 1
        alternatives:
        - tier: 0
          id: id
          type: type
          display_name: display_name
        - tier: 0
          id: id
          type: type
          display_name: display_name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        authenticator:
          id: id
          type: type
          display_name: display_name
        status: issued
      properties:
        id:
          format: uuid
          type: string
        purpose:
          enum:
          - login
          - step_up
          - enroll
          - recovery
          type: string
        status:
          enum:
          - issued
          - approved
          - denied
          - expired
          - failed
          type: string
        authenticator:
          $ref: "#/components/schemas/MfaChallenge_authenticator"
        alternatives:
          items:
            $ref: "#/components/schemas/MfaChallenge_alternatives_inner"
          type: array
        expires_at:
          format: date-time
          type: string
        attempts_remaining:
          type: integer
        delivery:
          enum:
          - push_sent
          - sms_sent
          - email_sent
          - code_expected
          - webauthn
          type: string
        number_match:
          description: Two-digit number to show the user when delivery is push_sent
          type: integer
        public_key:
          description: WebAuthn PublicKeyCredentialRequestOptions when delivery is
            webauthn
          type: object
      type: object
    MfaPolicy:
      example:
        min_tier_login: 1
        nudge_interval_days: 7
        sms_country_allowlist:
        - US
        - US
        trusted_device_days: 41
        min_tier_step_up: 2
        requirement: risk_based
        allowed_factors:
        - passkey
        - passkey
        sms_country_denylist:
        - sms_country_denylist
        - sms_country_denylist
        step_up_max_age_seconds: 3352
        required_factor_count: 1
        email_otp_counts_as_mfa: false
        remind_interval_days: 51
        passwordless_passkey: true
        required_since: 3
        grace_period_days: 53
        sms_block_voip: false
      properties:
        requirement:
          default: risk_based
          enum:
          - "off"
          - optional
          - required
          - risk_based
          type: string
        allowed_factors:
          items:
            enum:
            - passkey
            - push
            - totp
            - sms_otp
            - email_otp
            type: string
          type: array
        min_tier_login:
          default: 4
          maximum: 4
          minimum: 1
          type: integer
        min_tier_step_up:
          default: 3
          maximum: 4
          minimum: 1
          type: integer
        passwordless_passkey:
          default: true
          type: boolean
        required_factor_count:
          default: 1
          maximum: 2
          minimum: 1
          type: integer
        grace_period_days:
          default: 14
          maximum: 90
          minimum: 0
          type: integer
        remind_interval_days:
          default: 7
          maximum: 90
          minimum: 1
          type: integer
        trusted_device_days:
          default: 30
          maximum: 180
          minimum: 0
          type: integer
        email_otp_counts_as_mfa:
          default: false
          type: boolean
        sms_block_voip:
          default: false
          type: boolean
        sms_country_allowlist:
          items:
            example: US
            type: string
          type: array
        sms_country_denylist:
          items:
            type: string
          type: array
        nudge_interval_days:
          default: 30
          type: integer
        step_up_max_age_seconds:
          default: 600
          maximum: 3600
          minimum: 60
          type: integer
        required_since:
          nullable: true
          readOnly: true
          type: integer
      type: object
    MfaCoverageReport:
      example:
        deferred: 9
        enrolled_pct: 1.4658129805029452
        by_tier:
          key: 5
        generated_at: 2000-01-23T04:56:07.000+00:00
        in_grace: 2
        enrolled_users: 6
        requirement: requirement
        total_users: 0
        by_type:
          key: 5
        past_grace: 7
      properties:
        total_users:
          type: integer
        enrolled_users:
          type: integer
        enrolled_pct:
          type: number
        by_type:
          additionalProperties:
            type: integer
          type: object
        by_tier:
          additionalProperties:
            type: integer
          type: object
        requirement:
          type: string
        in_grace:
          type: integer
        past_grace:
          type: integer
        deferred:
          type: integer
        generated_at:
          format: date-time
          type: string
      type: object
    RedactedSecret:
      description: "Marker returned in place of a stored secret: the value is never\
        \ echoed back."
      example:
        configured: true
        redacted: true
      properties:
        configured:
          type: boolean
        redacted:
          type: boolean
      required:
      - configured
      - redacted
      type: object
    AuthenticationSettings:
      additionalProperties: true
      description: Authentication settings (entity defaults merged with the stored
