          headers:
            WWW-Authenticate:
              explode: false
              schema:
                type: string
              style: simple
        "404":
          description: "not_found — unknown organization, or unknown / inactive MCP\
            \ server."
        "429":
          description: too_many_requests (Retry-After header).
      security:
      - BearerAuth: []
      - {}
      summary: Simulated MCP server authorization challenge (POST)
      tags:
      - Mcp
      x-symfony-route: mcp_server_challenge
      x-accepts:
