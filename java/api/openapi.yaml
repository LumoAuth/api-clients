            \ no scope unless scopes were granted); authorization_details, jit_request_id\
            \ and task_id only for agent-initiated CIBA. Always sent with Cache-Control:\
            \ no-store."
          headers:
            DPoP-Nonce:
              description: Fresh server nonce when the request carried a DPoP proof
                (RFC 9449 §8).
              explode: false
              schema:
                type: string
              style: simple
        "400":
          description: invalid_request / invalid_grant / unsupported_grant_type /
            invalid_scope (RFC 6749 §5.2).
        "401":
          description: invalid_client — client authentication failed.
        "429":
          description: too_many_requests — rate limit exceeded.
      security:
      - ClientAuth: []
      - {}
      summary: OAuth 2.1 token endpoint
      tags:
      - OAuth
      x-symfony-route: oauth_token
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/oauth/userinfo:
    get:
      description: "Returns claims about the authenticated principal for an access\
        \ token presented as Authorization: Bearer or Authorization: DPoP (with a\
        \ DPoP proof when the token is sender-constrained). The openid scope is required."
      operationId: userinfo
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
          description: "Claims for the token's principal. The shape depends on the\
            \ identity type: a user token yields standard OIDC claims gated by scope\
            \ (profile, email, phone, address), roles only when the client enabled\
            \ the roles claim, plus tenant — null-valued claims are omitted; an agent\
            \ token yields sub=agent_<id>, name, agent_id, workload_identity, capabilities,\
            \ tenant, identity_type=agent; a client token yields sub=client_<id>,\
            \ client_id, name, tenant, identity_type=client. Sent with Cache-Control:\
            \ no-store."
        "400":
          description: invalid_request — Authorization header missing or malformed.
        "401":
          description: "invalid_token (invalid, expired, or wrong DPoP binding) or\
            \ invalid_dpop_proof."
        "403":
          description: insufficient_scope — the openid scope is required.
      security:
      - BearerAuth: []
      summary: OpenID Connect UserInfo endpoint
      tags:
      - OIDC
      x-symfony-route: oauth_userinfo
      x-accepts:
      - application/json
    post:
      description: Identical to GET.
      operationId: userinfoPost
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
          description: "Claims for the token's principal. The shape depends on the\
            \ identity type: a user token yields standard OIDC claims gated by scope\
            \ (profile, email, phone, address), roles only when the client enabled\
            \ the roles claim, plus tenant — null-valued claims are omitted; an agent\
            \ token yields sub=agent_<id>, name, agent_id, workload_identity, capabilities,\
            \ tenant, identity_type=agent; a client token yields sub=client_<id>,\
            \ client_id, name, tenant, identity_type=client. Sent with Cache-Control:\
            \ no-store."
        "400":
          description: invalid_request — Authorization header missing or malformed.
        "401":
          description: "invalid_token (invalid, expired, or wrong DPoP binding) or\
            \ invalid_dpop_proof."
        "403":
          description: insufficient_scope — the openid scope is required.
      security:
      - BearerAuth: []
      summary: OpenID Connect UserInfo endpoint (POST)
      tags:
      - OIDC
      x-symfony-route: oauth_userinfo
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/connect/register:
    post:
      description: "Registers an OAuth client from a JSON metadata document. Authenticated\
        \ with an initial access token (Authorization: Bearer) or an API key holding\
        \ admin:clients:register; open registration applies when the organization\
        \ allows it."
      operationId: registerClient
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterClientResponse"
          description: "Client registered (OIDC Dynamic Client Registration §3.2).\
            \ client_secret / client_secret_expires_at only for confidential clients;\
            \ registration_access_token and registration_client_uri when a registration\
            \ access token was issued; the remaining optional members echo registered\
            \ metadata and are omitted when empty or at their default. Sent with Cache-Control:\
            \ no-store."
        "400":
          description: "invalid_request (invalid JSON / unknown organization), invalid_client_metadata\
            \ or invalid_redirect_uri."
        "401":
          description: "access_denied — initial access token required or invalid (WWW-Authenticate:\
            \ Bearer)."
        "403":
          description: "access_denied — dynamic registration disabled for this organization,\
            \ or the API key is not authorized for it."
        "429":
          description: too_many_requests — rate limit exceeded.
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Dynamic client registration (RFC 7591 / OIDC DCR)
      tags:
      - OAuth
      x-symfony-route: oidc_register
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/connect/register/{clientId}:
    get:
      description: "Client configuration endpoint. Authenticated with the registration_access_token\
        \ issued at registration (Authorization: Bearer), presented at the same issuer\
        \ the client was registered under."
      operationId: getClientConfiguration
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: clientId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredClientMetadata"
          description: "Registered client metadata (OIDC Dynamic Client Registration\
            \ §4.3). Never includes client_secret or registration_access_token; optional\
            \ members are omitted when empty or at their default. Sent with Cache-Control:\
            \ no-store."
        "401":
          description: "invalid_token — registration access token missing, invalid,\
            \ for another client, or presented at a different issuer than the registration\
            \ (WWW-Authenticate: Bearer)."
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Read a dynamically registered client (RFC 7592 / OIDC DCR §4)
      tags:
      - OAuth
      x-symfony-route: oidc_client_configuration
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/.well-known/openid-configuration:
    get:
      description: "Public, CORS-enabled and cacheable (Cache-Control: public, max-age=3600).\
        \ Endpoint URLs are rewritten to the organization's custom domain when one\
        \ is active."
      operationId: getOpenidConfiguration
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIdConfiguration"
          description: "OpenID Provider metadata. Conditional members: client_id_metadata_document_supported\
            \ (CIMD opted in), authorization_grant_profiles_supported and the jwt-bearer\
            \ grant (Cross App Access resource role), op_policy_uri / op_tos_uri and\
            \ a tenant acr_values_supported override (organization settings)."
        "404":
          description: invalid_tenant — unknown or inactive organization.
      security: []
      summary: OpenID Provider configuration (OIDC Discovery 1.0)
      tags:
      - WellKnown
      x-symfony-route: oidc_discovery
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/.well-known/oauth-authorization-server:
    get:
      description: "Public, CORS-enabled and cacheable (Cache-Control: public, max-age=3600).\
        \ Endpoint URLs are rewritten to the organization's custom domain when one\
        \ is active."
      operationId: getAuthorizationServerMetadata
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
          description: "Authorization server metadata. Conditional members: client_id_metadata_document_supported\
            \ (CIMD opted in), authorization_grant_profiles_supported and the jwt-bearer\
            \ grant (Cross App Access resource role), op_policy_uri / op_tos_uri (organization\
            \ settings)."
        "404":
          description: invalid_tenant — unknown or inactive organization.
      security: []
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      tags:
      - WellKnown
      x-symfony-route: oauth_metadata
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/.well-known/jwks.json:
    get:
      description: "Public signing keys of the organization (its tenant signing keys\
        \ plus any platform keys kept for backward compatibility). Public, CORS-enabled\
        \ and cacheable (Cache-Control: public, max-age=3600)."
      operationId: getJwks
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonWebKeySet"
          description: "JWK Set. Each key is an RSA (n, e) or EC (crv, x, y) public\
            \ JWK with kid, use=sig and alg."
        "404":
          description: invalid_tenant — unknown or inactive organization.
      security: []
      summary: JSON Web Key Set (RFC 7517)
      tags:
      - WellKnown
      x-symfony-route: oidc_jwks
      x-accepts:
      - application/json
  /orgs/{orgId}/api/v1/oauth/check_session:
    get:
      description: The check_session_iframe page advertised in discovery. Relying
        parties embed it and postMessage "<client_id> <session_state>" to learn whether
        the OP session changed. Not a JSON API.
      operationId: checkSession
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: HTML page containing the session-state comparison script.
      security: []
      summary: OP session-check iframe (OIDC Session Management 1.0)
      tags:
      - OIDC
      x-symfony-route: oidc_check_session
      x-accepts:
      - text/html
  /orgs/{orgId}/api/v1/oauth/logout:
    get:
      description: "end_session_endpoint. Accepts id_token_hint, post_logout_redirect_uri\
        \ and state. Logs out immediately only when id_token_hint proves the request\
        \ is about the signed-in user; otherwise the user confirms through a CSRF-protected\
        \ POST. Triggers front-channel and back-channel logout for the session's clients.\
        \ Not a JSON API."
      operationId: logout
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: "HTML page: the logout confirmation prompt (signed-in user\
            \ without a matching id_token_hint), or the logout result page that embeds\
            \ the front-channel logout iframes for the session's clients."
        "302":
          description: Redirect to the validated post_logout_redirect_uri (state appended
            when given).
          headers:
            Location:
              explode: false
              schema:
                type: string
              style: simple
        "404":
          description: invalid_tenant — unknown or inactive organization (JSON).
      security: []
      summary: RP-initiated logout (OIDC RP-Initiated Logout 1.0)
      tags:
      - OIDC
      x-symfony-route: oidc_logout
      x-accepts:
      - text/html
    post:
      description: Same parameters as GET plus the _csrf_token of the confirmation
        page. Not a JSON API.
      operationId: logoutPost
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: "HTML page: the logout confirmation prompt (signed-in user\
            \ without a matching id_token_hint), or the logout result page that embeds\
            \ the front-channel logout iframes for the session's clients."
        "302":
          description: Redirect to the validated post_logout_redirect_uri (state appended
            when given).
          headers:
            Location:
              explode: false
              schema:
                type: string
              style: simple
        "404":
          description: invalid_tenant — unknown or inactive organization (JSON).
      security: []
      summary: RP-initiated logout (confirmation submission)
      tags:
      - OIDC
      x-symfony-route: oidc_logout
      x-accepts:
      - text/html
  /orgs/{orgId}/api/v1/agents/register:
    post:
      operationId: registerAgent
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
