  /orgs/{orgId}/api/v1/oauth/bc-authorize:
    post:
      description: "OpenID Connect Client-Initiated Backchannel Authentication (CIBA\
        \ Core §7). Classic CIBA: an authenticated client identifies the end user\
        \ with login_hint / id_token_hint / login_hint_token. Agent-initiated CIBA:\
        \ an agent (Authorization: Bearer with its agent credential, optionally on\
        \ behalf of a CIBA-enabled client via agent_id) asks a user to approve RFC\
        \ 9396 authorization_details. Poll the token endpoint with grant_type=urn:openid:params:grant-type:ciba\
        \ and the returned auth_req_id."
      operationId: backchannelAuthorize
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackchannelAuthorizeResponse"
          description: "Authentication request accepted (CIBA Core §7.3). The hint\
            \ is never confirmed: an unknown user yields an unstored auth_req_id of\
            \ the same shape. interval is present for poll and ping delivery modes\
            \ (always for agent-initiated requests)."
        "400":
          description: "invalid_request, unauthorized_client (CIBA not enabled for\
            \ the client or plan), invalid_scope, missing_user_code / invalid_user_code\
            \ or invalid_authorization_details."
        "401":
          description: invalid_client — client authentication failed.
        "403":
          description: unauthorized_client (agent_id named but not authenticated by
            that agent) or access_denied.
        "429":
          description: "too_many_requests, or slow_down when the target user already\
            \ has too many pending requests."
      security:
      - ClientAuth: []
      - {}
      summary: CIBA backchannel authentication request
      tags:
      - OAuth
      x-symfony-route: oauth_bc_authorize
      x-accepts:
      - application/json
