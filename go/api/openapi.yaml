  /orgs/{orgId}/api/v1/agents/me/mcp/authorize:
    post:
      description: |-
        The real request-path caller of {@see \McpToolAuthorizationService::canInvoke()}
        — the piece that connects MCP authorization to agent identity. An MCP
        gateway/server asks "may THIS agent invoke <server>/<tool>?" and gets a
        Zanzibar-backed allow/deny (tool-level or server-wide grant). Denials and
        grants are both audited, closing the MCP-authorization audit blind spot.

        POST /orgs/{orgId}/api/v1/agents/me/mcp/authorize
        Body: { "server_id": "invoices", "tool": "send_payment_reminder" }
      operationId: authorizeMcp
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeMcpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeMcpResponse"
          description: Allowed — the agent may invoke the tool.
        "403":
          description: Denied — no matching per-tool or server-wide grant.
        "400":
          description: "server_id and tool are required, or contain forbidden characters."
      summary: Per-MCP-tool authorization for the authenticated agent (dx B3).
      tags:
      - Agents
      x-symfony-route: api_agents_mcp_authorize
