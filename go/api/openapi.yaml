openapi: 3.0.0
info:
  contact:
    email: sdk@lumoauth.dev
    name: LumoAuth
    url: https://lumoauth.dev
  description: |
    LumoAuth REST API — authentication, authorization, agent registry,
    MCP server authorization, and tenant administration. Multi-tenant:
    most paths are scoped under `/orgs/{orgId}/api/v1/...`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: LumoAuth API
  version: 1.0.0
servers:
- description: Production
  url: https://app.lumoauth.dev
- description: Local
  url: http://localhost:8000
security:
- BearerAuth: []
- ApiKeyAuth: []
tags:
- description: Who-am-I lookup for users + agents.
  name: Identity
- description: "Agent registry, capabilities, attestation, runtime."
  name: Agents
- description: Policy Decision Point (RBAC + ABAC + Zanzibar).
  name: Authorization
- description: "Agent-native auth — token issuance, delegation, discovery."
  name: AAuth
- description: Model Context Protocol authorization (RFC 9728).
  name: Mcp
  x-displayName: MCP
- description: Just-in-time permissions with human-in-the-loop approval.
  name: Jit
  x-displayName: JIT
- description: "OAuth 2.0/2.1 protocol endpoints — token, introspection, revocation,\
    \ PAR, CIBA, device grant, authorization, dynamic client registration."
  name: OAuth
- description: "OpenID Connect — UserInfo, session management, RP-initiated logout."
  name: OIDC
- description: Public discovery documents (/.well-known/*) and JWKS.
  name: WellKnown
- description: Shared Signals Framework — event stream configuration and verification.
  name: Ssf
  x-displayName: SSF
- description: Agent token vault — third-party connection tokens.
  name: Token Vault
- description: CRUD on users; block/unblock; password and MFA reset.
  name: "Admin: Users"
- description: OAuth client lifecycle.
  name: "Admin: OAuth Clients"
- description: Admin-side agent registry CRUD.
  name: "Admin: Agents"
- description: Group membership management.
  name: "Admin: Groups"
- description: Role definitions + permission bindings.
  name: "Admin: Roles"
- description: Permission catalogue.
  name: "Admin: Permissions"
- description: List + revoke user sessions.
  name: "Admin: Sessions"
- description: Tenant-wide auth settings.
  name: "Admin: Settings"
- description: "Webhook CRUD, delivery log, replay."
  name: "Admin: Webhooks"
- description: B2B org and member management.
  name: "Admin: Organizations"
- description: Audit log search and export.
  name: "Admin: Audit Logs"
- description: ABAC attribute and policy management.
  name: "Admin: Abac"
  x-displayName: "Admin: ABAC"
- description: Tenant email template editor.
  name: "Admin: Email"
- description: Per-tenant social login config.
  name: "Admin: Identity Providers"
- description: Admin-side MCP server registry.
  name: "Admin: Mcp"
  x-displayName: "Admin: MCP"
- description: Ephemeral sandbox tenant lifecycle.
  name: "Admin: Sandbox"
paths:
  /orgs/{orgId}/api/v1/aauth/agent/token:
    post:
      description: |-
        Per Section 9: The agent token endpoint is the auth server's endpoint
        agents use to request auth tokens.

        Required HTTP signature covering: @method, @target-uri, content-type,
        content-digest, authorization
      operationId: issueAgentToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueAgentTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueAgentTokenResponse"
          description: "An auth token, or a request token + authorization URI when\
            \ user consent is needed."
        "400":
          description: "Invalid request (missing/unknown request_type, invalid body,\
            \ invalid resource/redirect)."
        "401":
          description: "Agent-Auth challenge — missing/invalid Agent-Auth header,\
            \ signature, or agent token."
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Agent Token Endpoint
      tags:
      - AAuth
      x-symfony-route: aauth_agent_token
  /orgs/{orgId}/api/v1/aauth/agent/auth:
    get:
      description: |-
        Per Section 9.4: The auth server redirects the user's browser
        to its authorization page.
      operationId: authorizeAgent
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "302":
          description: Redirect to the tenant portal AAuth consent page for the given
            request_token.
        "400":
          description: Missing request_token query parameter.
      security:
      - AAuthSigned: []
      summary: Agent Auth Endpoint - redirects to user consent page.
      tags:
      - AAuth
      x-symfony-route: aauth_agent_auth
  /orgs/{orgId}/api/v1/aauth/agent/issue:
    post:
      description: |-
        Called by the agent server when a delegate needs to act on its behalf.

        This endpoint requires the agent server to authenticate itself
        (via HTTP signature with its registered key).
      operationId: issueDelegateToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDelegateTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDelegateTokenResponse"
          description: The issued agent token and its metadata.
        "400":
          description: "Invalid JSON body, or missing delegate_sub / delegate_public_key."
        "401":
          description: Agent server HTTP-message-signature verification failed.
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Issue an agent token to a delegate.
      tags:
      - AAuth
      x-symfony-route: aauth_agent_issue
  /orgs/{orgId}/api/v1/aauth/token/revoke:
    post:
      operationId: revokeAgentToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAgentTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAgentTokenResponse"
          description: Revocation acknowledged (always 200 — existence of the token
            is not disclosed).
        "400":
          description: Missing token parameter.
        "401":
          description: Agent-Auth challenge — authentication/signature verification
            failed.
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Revoke an auth token or refresh token.
      tags:
      - AAuth
      x-symfony-route: aauth_token_revoke
  /orgs/{orgId}/api/v1/.well-known/aauth-issuer:
    get:
      operationId: getIssuerMetadata
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIssuerMetadataResponse"
          description: AAuth auth-server metadata document (Section 8.2).
      security: []
      summary: |-
        Auth Server Metadata (Section 8.2)
        Published at /.well-known/aauth-issuer for each tenant.
      tags:
      - AAuth
      x-symfony-route: aauth_issuer_metadata
  /orgs/{orgId}/api/v1/aauth/jwks.json:
    get:
      operationId: getIssuerJwks
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: The auth server JWKS (public keys used to verify issued JWTs).
      security: []
      summary: Auth Server JWKS endpoint for AAuth.
      tags:
      - AAuth
      x-symfony-route: aauth_issuer_jwks
  /orgs/{orgId}/api/v1/.well-known/aauth-agent:
    get:
      operationId: getAgentMetadata
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: Metadata documents for all active agents of this tenant (Section
            8.1).
      security: []
      summary: |-
        Agent Metadata (Section 8.1)
        Published at /.well-known/aauth-agent for registered agents.
      tags:
      - AAuth
      x-symfony-route: aauth_agent_metadata
  /orgs/{orgId}/api/v1/aauth/agents/{agentId}/metadata:
    get:
      operationId: getAgentMetadataById
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Metadata document for a single active agent.
        "404":
          description: Agent not found.
      security: []
      summary: Individual Agent Metadata
      tags:
      - AAuth
      x-symfony-route: aauth_agent_metadata_single
  /orgs/{orgId}/api/v1/aauth/agents/{agentId}/jwks.json:
    get:
      operationId: getAgentJwks
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: The agent JWKS.
        "404":
          description: Agent not found.
      security: []
      summary: Agent JWKS endpoint
      tags:
      - AAuth
      x-symfony-route: aauth_agent_jwks
  /orgs/{orgId}/api/v1/.well-known/aauth-resource:
    get:
      operationId: getResourceMetadata
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: Metadata documents for all active resources of this tenant
            (Section 8.3).
      security: []
      summary: Resource Metadata (Section 8.3)
      tags:
      - AAuth
      x-symfony-route: aauth_resource_metadata
  /orgs/{orgId}/api/v1/aauth/resources/{resourceId}/metadata:
    get:
      operationId: getResourceMetadataById
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Metadata document for a single active resource.
        "404":
          description: Resource not found.
      security: []
      summary: Individual Resource Metadata
      tags:
      - AAuth
      x-symfony-route: aauth_resource_metadata_single
  /orgs/{orgId}/api/v1/aauth/resources/{resourceId}/jwks.json:
    get:
      operationId: getResourceJwks
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: The resource JWKS.
        "404":
          description: Resource not found.
      security: []
      summary: Resource JWKS endpoint
      tags:
      - AAuth
      x-symfony-route: aauth_resource_jwks
  /orgs/{orgId}/api/v1/aauth/agent/platform-token:
    post:
      operationId: issuePlatformToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuePlatformTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePlatformTokenResponse"
          description: "A short-lived core-agent access token accepted by JIT, the\
            \ token vault, and the authz PDP."
        "400":
          description: Invalid exchange request (grant_type / subject_token).
        "401":
          description: "The AAuth token is invalid, expired, or revoked."
        "403":
          description: Denied by a conditional access policy.
      security:
      - AAuthSigned: []
      tags:
      - AAuth
      x-symfony-route: aauth_agent_platform_token
  /orgs/{orgId}/api/v1/aauth/resource/token:
    post:
      description: |-
        Called by a registered resource to create a resource token
        binding an agent's request to the resource's identity.

        The resource authenticates via HTTP Message Signature using
        its registered key.
      operationId: issueResourceToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueResourceTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResourceTokenResponse"
          description: A resource token binding the agent request to the resource
            identity.
        "400":
          description: "Invalid JSON body, missing agent/agent_jkt, or unsupported\
            \ scope."
        "401":
          description: Resource authentication (HTTP message signature) failed.
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Resource Token Endpoint (Section 6)
      tags:
      - AAuth
      x-symfony-route: aauth_resource_token
  /orgs/{orgId}/api/v1/aauth/resource/token/verify:
    post:
      description: A convenience endpoint—resources can also validate locally.
      operationId: verifyResourceToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResourceTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResourceTokenResponse"
          description: Introspection result; active=false with an error when the token
            is invalid.
        "400":
          description: "Missing resource_token, agent, or agent_jkt."
        "401":
          description: Resource authentication failed.
        "403":
          description: Resource token is not valid for the authenticated resource.
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Resource Token Verification (for resources to validate their own tokens).
      tags:
      - AAuth
      x-symfony-route: aauth_resource_token_verify
  /orgs/{orgId}/api/v1/aauth/auth/token/verify:
    post:
      description: |-
        Resources call this to validate an auth token presented by an agent.
        Per Section 7.7, the resource validates:
          1. JWT signature from trusted auth server
          2. aud matches resource identifier
          3. exp is in the future
          4. HTTP Message Signature on the agent's incoming request matches the
             key whose thumbprint is `cnf_jkt` in the response.

        IMPORTANT — proof-of-possession is mandatory. A response of
        `{"active": true, ...}` from this endpoint means the JWT is well-formed
        and bound to the named resource; it does NOT mean the caller is the
        legitimate holder of the token. The resource MUST independently verify
        that the HTTP Message Signature on the agent's request was produced with
        the key that hashes to `cnf_jkt`. A token without this PoP check is
        effectively a bearer token and can be replayed by anyone who observes
        it. The response includes `pop_required: true` to surface this contract
        to integrators who only inspect `active`.
      operationId: verifyAuthToken
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAuthTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyAuthTokenResponse"
          description: Introspection result. active=true does NOT imply PoP — the
            caller MUST verify the HTTP message signature against cnf_jkt.
        "400":
          description: Missing auth_token or resource.
        "401":
          description: Resource authentication failed.
        "403":
          description: Requested resource does not match the authenticated resource.
        "429":
          description: Rate limit exceeded.
      security:
      - AAuthSigned: []
      summary: Auth Token Verification endpoint.
      tags:
      - AAuth
      x-symfony-route: aauth_auth_token_verify
  /orgs/{orgId}/api/v1/abac/check:
    post:
      description: |-
        POST /api/v1/abac/check
        Body: {
          resourceType: string,
          action: string,
          resourceId?: string,
          environment?: { ip?: string, userAgent?: string, ... }
        }

        Returns: { allowed: boolean, reason: string, matchedPolicies: [...] }
      operationId: checkAbac
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Check ABAC authorization
      tags:
      - Authorization
      x-symfony-route: api_abac_check
  /orgs/{orgId}/api/v1/abac/check-bulk:
    post:
      description: |-
        POST /api/v1/abac/check-bulk
        Body: {
          checks: [
            { resourceType: string, action: string, resourceId?: string },
            ...
          ],
          environment?: { ... }
        }
      operationId: checkAbacBulk
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Bulk check multiple authorization requests
      tags:
      - Authorization
      x-symfony-route: api_abac_check_bulk
  /orgs/{orgId}/api/v1/abac/my-attributes:
    get:
      description: GET /api/v1/abac/my-attributes
      operationId: getMyAttributes
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Get user's current attributes (for debugging/UI)
      tags:
      - Authorization
      x-symfony-route: api_abac_my_attributes
  /orgs/{orgId}/api/v1/abac/resources/{resourceType}/{resourceId}/attributes:
    get:
      description: "GET /api/v1/abac/resources/{resourceType}/{resourceId}/attributes"
      operationId: getResourceAttributes
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Get resource attributes
      tags:
      - Authorization
      x-symfony-route: api_abac_resource_attributes
  /orgs/{orgId}/api/v1/abac/resources/{resourceType}/{resourceId}/attributes/{attributeSlug}:
    put:
      description: |-
        PUT /api/v1/abac/resources/{resourceType}/{resourceId}/attributes/{attributeSlug}
        Body: { value: any }
      operationId: setResourceAttribute
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: attributeSlug
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Set resource attribute
      tags:
      - Authorization
      x-symfony-route: api_abac_set_resource_attribute
  /orgs/{orgId}/api/v1/abac/users/{userId}/attributes/{attributeSlug}:
    put:
      description: |-
        PUT /api/v1/abac/users/{userId}/attributes/{attributeSlug}
        Body: { value: any }
      operationId: setUserAttribute
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: attributeSlug
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Set user attribute
      tags:
      - Authorization
      x-symfony-route: api_abac_set_user_attribute
  /orgs/{orgId}/api/v1/abac/attribute-definitions:
    get:
      description: |-
        GET /api/v1/abac/attribute-definitions
        Query params: type (user|resource|environment)
      operationId: listAttributeDefinitions
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Get available attribute definitions
      tags:
      - Authorization
      x-symfony-route: api_abac_attribute_definitions
  /orgs/{orgId}/api/v1/abac/attributes:
    get:
      operationId: abacAttributesList
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: List all attribute definitions
      tags:
      - "Admin: Abac"
      x-symfony-route: api_abac_attributes_list
    post:
      operationId: abacAttributesCreate
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Create a new attribute definition
      tags:
      - "Admin: Abac"
      x-symfony-route: api_abac_attributes_create
  /orgs/{orgId}/api/v1/abac/attributes/{id}:
    delete:
      operationId: abacAttributesDelete
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Delete an attribute definition
      tags:
      - "Admin: Abac"
      x-symfony-route: api_abac_attributes_delete
    get:
      operationId: abacAttributesGet
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
      summary: Get a single attribute definition
      tags:
      - "Admin: Abac"
      x-symfony-route: api_abac_attributes_get
    patch:
      operationId: patchAbacAttributesUpdate
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        default:
          description: ""
