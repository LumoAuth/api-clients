      description: |-
        Each task gets a unique sub-identity with isolated permissions.
        This limits the "blast radius" of any potential compromise.

        Request body:
        {
          "name": "Research Task #123",           // Optional: human-readable name
          "type": "research",                     // Optional: task type for categorization
          "parent_task_id": "task_abc123",        // Optional: for nested agent chains
          "on_behalf_of": "user@example.com"      // Optional: delegation context
        }
      operationId: createTask
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
          description: Ephemeral task/persona created.
        "400":
          description: Delegation user not found or not authorized.
        "401":
          description: Invalid or missing agent token.
        "403":
          description: Agent is not authorized to act on behalf of users.
        "404":
          description: Tenant not found.
        "429":
          description: Rate limit exceeded.
      security:
      - BearerAuth: []
      summary: Create a new ephemeral task/persona for an agent.
      tags:
      - Jit
      x-symfony-route: jit_create_task
  /orgs/{orgId}/api/v1/jit/request:
    post:
      description: |-
        Request body:
        {
          "task_id": "task_abc123",                     // Required: task context
          "authorization_details": {                    // Required: RFC 9396 object
            "type": "file_access",
            "actions": ["read"],
            "identifier": "report_2024.pdf"
          },
          "justification": "Need to analyze Q4 data",   // Optional: human-readable
          "requested_ttl": 300,                         // Optional: 5-15 minutes (default 10)
          "callback_url": "https://..."                 // Optional: HITL notification webhook
        }

        Response:
        - For low-risk: Immediate approval + ability to get token
        - For high-risk: Returns pending status, triggers HITL workflow
      operationId: requestPermission
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPermissionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPermissionResponse"
          description: "Permission request created (auto-approved for low risk, otherwise\
            \ pending HITL)."
        "400":
          description: "Missing/invalid task_id, authorization_details, or the task\
            \ is not active."
        "401":
          description: Invalid or missing agent token.
        "403":
          description: Task belongs to a different agent.
        "404":
          description: Tenant or task not found.
        "429":
          description: Rate limit exceeded.
      security:
      - BearerAuth: []
      summary: Request a JIT permission using RFC 9396 authorization_details.
      tags:
      - Jit
      x-symfony-route: jit_request_permission
